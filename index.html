<style>
:root{

*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);

.mapcard{background:rgba(255,255,255,.35);border:1px solid var(--line);border-radius:8px;padding:1.2rem;position:relative}
svg{width:100%;height:auto;display:block}
.regpath{stroke:#fff;stroke-width:2;cursor:default;transition:fill .35s}
.reglabel{font-family:var(--serif);fill:var(--ink);font-weight:600}
.regval{font-family:var(--latin);font-style:italic;font-weight:600}
.lblbg{fill:rgba(246,242,234,.82);stroke:rgba(255,255,255,.7);stroke-width:1}
.controls{display:flex;flex-direction:column;gap:1.6rem}
.cgroup .ct{font-family:var(--latin);font-style:italic;color:var(--ver);font-size:1.05rem;letter-spacing:.12em;margin-bottom:.7rem}
.btns{display:flex;gap:.5rem;flex-wrap:wrap}
.btn{font-family:var(--serif);font-size:1.02rem;padding:.5rem 1.1rem;border:1px solid var(--line);background:rgba(255,255,255,.5);border-radius:4px;cursor:pointer;color:var(--ink);transition:all .2s}
.btn:hover{border-color:var(--ver)}
.btn.on{background:var(--ver);color:#fff;border-color:var(--ver)}
.btn.on.f1{background:var(--indigo);border-color:var(--indigo)}
.btn.on.f2{background:#6b4a28;border-color:#6b4a28}
.btn.on.f3{background:var(--gold);border-color:var(--gold)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:4px;overflow:hidden}
.seg .btn{border:none;border-radius:0;border-right:1px solid var(--line)}
.seg .btn:last-child{border-right:none}
.legend{margin-top:.3rem}
.legbar{height:16px;border-radius:3px;border:1px solid var(--line)}
.legends{display:flex;justify-content:space-between;font-family:var(--latin);font-style:italic;color:var(--mute);font-size:1rem;margin-top:.3rem}
.rank{border-top:1px solid var(--line);padding-top:1.1rem}
.rankttl{font-family:var(--serif);font-weight:600;font-size:1.08rem;margin-bottom:.9rem}
.rankttl b{color:var(--ver)}
.rrow{display:grid;grid-template-columns:9.5em 1fr 3.4em;align-items:center;gap:.7rem;margin-bottom:.7rem}
.rrow .nm{font-family:var(--serif);font-size:1rem}

.note{font-family:var(--sans);color:var(--mute);font-size:.8rem;line-height:1.7;margin-top:2.4vh;border-top:1px solid var(--line);padding-top:1.2vh}
</style>

const FLAV = DATA.flav; // ['味噌','塩','醤油','バター']
// 味ごとの色ランプ [淡, 濃]
const RAMP = {
  0:['#f3e7df','#9c3022'], // 味噌 朱→濃朱茶
  1:['#e7ecf2','#2c4a6e'], // 塩 淡藍→藍
  2:['#ece1cf','#5f4022'], // 醤油 淡茶→濃茶
  3:['#f3ecd2','#8a7233'], // バター 淡金→金
};
const FCLS={0:'',1:'f1',2:'f2',3:'f3'};
let fi=0, type='tan';

function hex2rgb(h){return [parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];}
function lerp(a,b,t){return Math.round(a+(b-a)*t);}
function rampColor(t,fi){const[c0,c1]=RAMP[fi];const A=hex2rgb(c0),B=hex2rgb(c1);
  return `rgb(${lerp(A[0],B[0],t)},${lerp(A[1],B[1],t)},${lerp(A[2],B[2],t)})`;}

function vals(){return DATA.regions.map(r=>r[type][fi]);}
function domain(){const v=vals();return [Math.min(...v),Math.max(...v)];}

const svg=document.getElementById('map');
function draw(){
  const [lo,hi]=domain();
  const span=(hi-lo)||1;
  let s='';
  // ポリゴン
  DATA.regions.forEach((r,idx)=>{
    const v=r[type][fi];
    const t=(v-lo)/span;
    const col=rampColor(0.18+0.82*t, fi); // 下限を少し持ち上げ視認性確保
    r.paths.forEach(d=>{ s+=`<path class="regpath" d="${d}" fill="${col}"></path>`; });
  });
  // ラベル（背景＋名前＋値）
  DATA.regions.forEach(r=>{
    const v=r[type][fi];
    const [x,y]=r.label;
    const short=r.reg.split('・')[1];
    const w=Math.max(short.length*26+34, 104);
    s+=`<g>
      <rect class="lblbg" x="${x-w/2}" y="${y-30}" width="${w}" height="56" rx="8"></rect>
      <text class="reglabel" x="${x}" y="${y-6}" text-anchor="middle" font-size="23">${short}</text>
      <text class="regval" x="${x}" y="${y+20}" text-anchor="middle" font-size="26" fill="${rampColor(0.95,fi)}">${v.toFixed(1)}</text>
    </g>`;
  });
  svg.innerHTML=s;
  // 凡例
  const [c0,c1]=RAMP[fi];
  document.getElementById('legbar').style.background=`linear-gradient(90deg,${rampColor(0.18,fi)},${rampColor(1,fi)})`;
  document.getElementById('legLo').textContent=lo.toFixed(1);
  document.getElementById('legHi').textContent=hi.toFixed(1);
  document.getElementById('legTtl').textContent=`scale ／ ${FLAV[fi]}率（％）`;
  // ランキング
  document.getElementById('rankFlav').textContent=FLAV[fi];
  document.getElementById('rankType').textContent=(type==='tan'?'単品':'単品＋セット');
  const sorted=[...DATA.regions].sort((a,b)=>b[type][fi]-a[type][fi]);
  const maxv=sorted[0][type][fi];
  document.getElementById('rankList').innerHTML=sorted.map(r=>{
    const v=r[type][fi];const w=(v/maxv*100).toFixed(0);
    return `<div class="rrow"><div class="nm">${r.reg}</div><div class="tr"><span style="width:${w}%;background:${rampColor(0.85,fi)}"></span></div><div class="pc">${v.toFixed(1)}</div></div>`;
  }).join('');
}

// 味ボタン
const fb=document.getElementById('flavBtns');
FLAV.forEach((f,i)=>{
  const b=document.createElement('button');
  b.className='btn'+(i===0?' on':'')+(i===0?'':'');
  b.textContent=f; b.dataset.i=i;
  b.onclick=()=>{fi=i;document.querySelectorAll('#flavBtns .btn').forEach((x,j)=>{x.className='btn'+(j===i?' on '+FCLS[i]:'');});draw();};
  fb.appendChild(b);
});
document.querySelectorAll('#typeSeg .btn').forEach(b=>{
  b.onclick=()=>{type=b.dataset.t;document.querySelectorAll('#typeSeg .btn').forEach(x=>x.classList.remove('on'));b.classList.add('on');draw();};
});
document.getElementById('note').innerHTML='出典：株式会社ハチバン提供「2025年度 野菜らーめん出数構成比」（2025/3/21〜2026/3/20）。富山・石川の6地域それぞれの店舗平均（単品ベース、区分切替で単品＋セット合計）。色は選択中の味の構成比で、濃いほど高い。地域区分の境界は市町村界（国土数値情報）を6地域に統合したもの。個別店舗の数値は含みません。';
draw();
